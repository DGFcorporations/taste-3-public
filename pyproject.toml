[project]
name = "taste-3"
version = "0.1.0"
description = "Private TASTE v1 engine with a profile-isolated temporal graph"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "fastembed==0.9.0",
  "mcp==2.3.0",
  "granian==2.8.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
taste = "taste.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: actual model or protocol verification", "performance: synthetic scale measurements"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "granian.*", "numpy.*", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
